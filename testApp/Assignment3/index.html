<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflex Grid - Final Fix</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #222;
        color: #fff;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        user-select: none;
      }
      h1 {
        margin-top: 20px;
      }

      #game-container {
        position: relative;
        width: 320px;
        height: 320px;
        margin: 20px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 10px;
        background: #333;
        border-radius: 8px;
      }
      .tile {
        background: #444;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.1s;
        border: 2px solid #444;
      }

      .tile.active {
        background: #00d2ff;
        border-color: #fff;
        box-shadow: 0 0 15px #00d2ff;
      }

      .tile.hit {
        background: #55ff55 !important;
        border-color: #fff;
        transform: scale(0.9);
        box-shadow: 0 0 15px #55ff55;
      }

      #ui-layer {
        margin-bottom: 10px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #00d2ff;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        color: #000;
        transition: background 0.2s;
      }
      button:hover {
        background: #33eaff;
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
        color: #888;
      }

      #modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }
      #modal h2 {
        margin: 0 0 10px 0;
        color: #ff5555;
      }
      #modal input {
        padding: 12px;
        font-size: 16px;
        margin: 15px 0;
        border: none;
        border-radius: 4px;
        width: 200px;
        text-align: center;
      }

      #leaderboard {
        width: 320px;
        text-align: left;
        background: #2a2a2a;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        box-sizing: border-box;
      }
      .entry {
        border-bottom: 1px solid #444;
        padding: 8px 0;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .entry span:first-child {
        color: #00d2ff;
        font-weight: bold;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>Reflex Grid</h1>

    <div id="ui-layer">
      <h3>Score: <span id="score-display">0</span></h3>
      <button id="start-btn">Start Game</button>
      <p><small style="color: #888">Press 'Escape' to stop.</small></p>
    </div>

    <div id="game-container"></div>

    <div id="leaderboard">
      <h3>High Scores</h3>
      <div id="score-list"></div>
    </div>

    <div id="modal">
      <h2>Game Over!</h2>
      <p style="font-size: 1.2em">
        Final Score: <span id="final-score">0</span>
      </p>
      <input
        type="text"
        id="player-name"
        placeholder="Enter Name"
        maxlength="30"
      />
      <button id="save-score-btn">Save Score</button>
      <button
        id="cancel-btn"
        style="background: transparent; color: #aaa; margin-top: 10px"
      >
        Close
      </button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
